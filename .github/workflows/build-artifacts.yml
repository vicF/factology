name: Alpha build artifacts

# Builds the Android APK and the Windows Electron installer so alpha testers
# can download ready-made binaries instead of building locally.
#
#   - push to develop        -> APK + installer are stored as run artifacts
#                               (downloadable from the Actions run page)
#   - push a tag like v*     -> both binaries are also attached to a GitHub
#                               Release (prerelease when the tag contains a
#                               dash, e.g. v0.1.0-alpha.1)
#   - workflow_dispatch      -> build any branch manually from the Actions tab
#
# Both builds are standalone/offline: no VITE_API_URL is set (no .env.capacitor
# in CI), so the resulting apps run against the local Dexie store.

on:
  push:
    branches: [ develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Present on GitHub-hosted ubuntu runners; build-android.sh skips its
      # local (Windows path) fallback when these are set.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build debug APK
        # Runs the Capacitor SPA build, `cap add/sync android` (the android/
        # platform is gitignored and regenerated on every build) and
        # `gradlew assembleDebug`; copies the APK to dist-android/.
        run: bash build-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist-android/factology-debug.apk
          if-no-files-found: error

  desktop:
    name: Electron installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # No code-signing certificate in CI - don't let electron-builder stall
      # trying to discover one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SPA and copy into electron/app
        shell: bash
        run: bash build-electron.sh

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Package NSIS installer
        working-directory: electron
        run: npm run electron:make

      - name: Upload Electron installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-electron
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Only tag pushes attach files to a Release; develop pushes stop at the
    # run-artifact uploads above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: android-apk

      - name: Download Electron installer
        uses: actions/download-artifact@v7
        with:
          name: desktop-electron
          path: desktop-electron

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/factology-debug.apk
            desktop-electron/*.exe
            desktop-electron/latest.yml
            desktop-electron/*.blockmap
          # v1.0.0 -> stable; anything with a dash (alpha/beta/rc) -> prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
